name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  validar:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validar agentes y schema
        run: node scripts/validar.js

      - name: Revisar la sintaxis del hook
        run: node --check hooks/sin-escritura.js
